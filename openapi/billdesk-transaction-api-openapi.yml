          pattern: ^[0-9A-Za-z\\.\\+\\-\\/\\=\\*\\,\\;]{10,255}$
        browser_language:
          type: string
          description: Value representing the browser language, returned from navigator.language property, for eg. en-US
          maxLength: 5
          example: en-US
          pattern: ^[A-Za-z\\-]{2,5}$
        browser_javascript_enabled:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Boolean (true or false) that represents the ability of the cardholder browser to execute JavaScript.

            Note – if true, additional attributes of browser_tz, browser_color_depth, browser_java_enabled, browser_screen_height, browser_screen_width are mandatory'
        browser_tz:
          type: string
          description: 'Time-zone offset in minutes between UTC and the Cardholder browser local time.


            Note that the offset is positive if the local time zone is behind UTC and negative if it is ahead. For eg. if UTC -5 hours then browser_tz = 300 and if UTC +5 hours then browser_tz = -300’'
          pattern: ^[0-9\\+\\-]{2,6}$
          maxLength: 6
          example: '-330'
        browser_color_depth:
          type: string
          description: 'Value representing the bit depth of the colour palette for displaying images, in bits per pixel.


            Obtained from Cardholder browser using the screen.Color.Depth property. In case the actual vaue does not exist in the allowed values, use the closest lower value,for eg. 32'
          maxLength: 5
          pattern: ^[0-9]{2,5}$
          example: '652'
        browser_java_enabled:
          type: string
          description: Boolean (true or false) that represents the ability of the cardholder browser to execute Java. Value is returned from the navigator.javaEnabled property
          enum:
          - 'true'
          - 'false'
        browser_screen_height:
          type: string
          description: Total height of the Cardholder’s screen in pixels. Value is returned from the screen.height property for eg. 601
          pattern: ^[0-9]{2,5}$
          example: '452'
          maxLength: 5
        browser_screen_width:
          type: string
          description: Total width of the cardholder’s screen in pixels. Value is returned from the screen.width property, for eg. 657
          pattern: ^[0-9]{2,5}$
          example: '702'
          maxLength: 5
