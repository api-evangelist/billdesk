components:
  schemas:
    Mercid:
      title: mercid
      x-stoplight:
        id: 43ns25lu1fyuc
      type: string
      pattern: ^[A-Za-z0-9]{1,10}$
      example: BDMERCID
      description: Unique identifier as defined by BillDesk for each merchant
    Error_desc:
      title: error_desc
      x-stoplight:
        id: uyor3loffwtew
      type: string
      description: Represents the error description for the response
    Early_payment_amount:
      title: early_payment_amount
      x-stoplight:
        id: u4yui5aos3xnp
      type: string
      description: Amount after adjusting any discount applicable.
      example: '490.00'
      pattern: ^([1-9]{1}[0-9]{0,7}(\.[0-9]{1,2})?)$
    Createdon:
      title: createdon
      x-stoplight:
        id: k3ewegvbimz0g
      type: string
      description: object creation timestamp
      format: date-time
    Invoice-status:
      title: invoice status
      x-stoplight:
        id: 5u2aujpkflkqe
      type: string
      description: "Status of the invoice. Possible values are:\n•\tunpaid – invoice has been received successfully, and charge can be processed\n•\trejected – invoice has been rejected by the system\n•\tstopped – invoice has been stopped by the customer"
      enum:
      - unpaid
      - rejected
      - stopped
    Error-object:
      type: object
      properties:
        status:
          type: integer
          description: This will be same as HTTP response code
        error_type:
          type: string
          description: This indicates of the category of errors that could be encountered, for e.g. validation_error, api_connection_error, etc.
        error_code:
          type: string
          description: Under the error_type, there could be different error_codes that could be returned depending upon the API and the underlying interaction
        message:
          type: string
          description: More details as a description for the error_code
    Invoice-description:
      title: invoice description
      x-stoplight:
        id: uupk2dh7h3o3d
      type: string
      description: Brief description for the invoice
