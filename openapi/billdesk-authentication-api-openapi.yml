      properties:
        altid_token:
          type: object
          required:
          - altid_value
          - altid_cryptogram
          - altid_expiry_month
          - altid_expiry_year
          properties:
            altid_value:
              type: string
              description: Token Value – as received from TSP, provided in the ‘Detokenize’ response
              pattern: ^[A-Za-z0-9]{1,35}$
