          additional_info:
            additional_info1: Details1
            additional_info2: Details2
            additional_info3: Details3
            additional_info4: Details4
            additional_info5: Details5
            additional_info6: Details6
            additional_info7: Details7
            additional_info8: Details8
            additional_info9: Details9
            additional_info10: Details10
      description: 'Array of 7 additional_info values that can be attached to

        the transaction.

        Note: Merchant is advised to not pass customer PII

        information in additional info fields.'
      properties:
        additional_info1:
          type: string
          example: Details1
        additional_info2:
          type: string
          example: Details2
        additional_info3:
          type: string
          example: Details3
        additional_info4:
          type: string
          example: Details4
        additional_info5:
          type: string
          example: Details5
        additional_info6:
          type: string
          example: Details6
        additional_info7:
          type: string
          example: Details7
    Card-Response:
      type: object
      x-stoplight:
        id: n1nmwdiqy5hrc
      x-examples:
        Example 1:
          card:
            type: DEBIT
            card_end: '1234'
            network: VISA
            issuer: ABC Bank
      properties:
        type:
          $ref: '#/components/schemas/Card_type'
          description: Card product type, takes the following values - debit, credit or prepaid
        masked_value:
          $ref: '#/components/schemas/Masked_value'
          description: "Last 4 digits of the card number \nNote: For an EMI transaction via network token, this attribute value is required for loan booking"
        network:
          $ref: '#/components/schemas/Card_network'
          description: Card network, for eg. visa
        issuer:
          $ref: '#/components/schemas/Card_issuer'
          description: Card issuer
    Device:
      type: object
      x-stoplight:
        id: 1dup8vlut7f5l
      x-examples:
        Example 1:
          device:
            init_channel: internet
            ip: 124.124.1.1
