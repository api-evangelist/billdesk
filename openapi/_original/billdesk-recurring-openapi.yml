            user_agent: Mozilla/5.0(WindowsNT10.0;WOW64;rv:51.0)Gecko/20100101Firefox/51.0
            accept_header: text/html
            fingerprintid: 61b12c18b5d0cf901be34a23ca64bb19
            browser_tz: '-330'
            browser_color_depth: '32'
            browser_java_enabled: 'false'
            browser_screen_height: '601'
            browser_screen_width: '657'
            browser_language: en-US
            browser_javascript_enabled: 'true'
      title: Device object
      description: Device Object
      properties:
        init_channel:
          type: string
          description: Initiating channel,accepted values are internet,app or kiosk
          enum:
          - internet
          - app
          - kiosk
        ip:
          type: string
          description: Customer’s IP address
          maxLength: 15
        user_agent:
          type: string
          description: 'Exact content of the HTTP user-agent header


            Note: If the total length of the User-Agent sent by the browser exceeds 2048 characters, truncate the excess portion'
          example: 'Mozilla/5.0(WindowsNT10.0;WOW64;rv: 51.0)Gecko/20100101Firefox/51.0'
          pattern: =^[A-Za-z0-9\\_\\:\\-\\,\\;\\/\\)\\(\\.\\s\\+\\[\\]\\=@]{10,255}$
        accept_header:
          type: string
          description: Customer browser accept header values
          maxLength: 255
          example: application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
          pattern: ^[0-9A-Za-z\\.\\+\\-\\/\\=\\*\\,\\;]{10,255}$
        browser_language:
          type: string
          description: Value representing the browser language, returned from navigator.language property, for eg. en-US
          maxLength: 5
          example: en-US
          pattern: ^[A-Za-z\\-]{2,5}$
        browser_javascript_enabled:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Boolean (true or false) that represents the ability of the cardholder browser to execute JavaScript.

            Note – if true, additional attributes of browser_tz, browser_color_depth, browser_java_enabled, browser_screen_height, browser_screen_width are mandatory'
        browser_tz:
          type: string
          description: 'Time-zone offset in minutes between UTC and the Cardholder browser local time.


            Note that the offset is positive if the local time zone is behind UTC and negative if it is ahead. For eg. if UTC -5 hours then browser_tz = 300 and if UTC +5 hours then browser_tz = -300’'
          pattern: ^[0-9\\+\\-]{2,6}$
          maxLength: 6
          example: '-330'
        browser_color_depth:
          type: string
          description: 'Value representing the bit depth of the colour palette for displaying images, in bits per pixel.


            Obtained from Cardholder browser using the screen.Color.Depth property. In case the actual vaue does not exist in the allowed values, use the closest lower value,for eg. 32'
          maxLength: 5
          pattern: ^[0-9]{2,5}$
          example: '652'
        browser_java_enabled:
          type: string
          description: Boolean (true or false) that represents the ability of the cardholder browser to execute Java. Value is returned from the navigator.javaEnabled property
          enum:
          - 'true'
          - 'false'
        browser_screen_height:
          type: string
          description: Total height of the Cardholder’s screen in pixels. Value is returned from the screen.height property for eg. 601
          pattern: ^[0-9]{2,5}$
          example: '452'
          maxLength: 5
        browser_screen_width:
          type: string
          description: Total width of the cardholder’s screen in pixels. Value is returned from the screen.width property, for eg. 657
          pattern: ^[0-9]{2,5}$
          example: '702'
          maxLength: 5
      required:
      - init_channel
      - ip
      - user_agent
      - accept_header
      - browser_language
      - browser_javascript_enabled
