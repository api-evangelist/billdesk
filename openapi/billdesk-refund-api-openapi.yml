            refund_amount: '25.00'
      properties:
        mercid:
          type: string
          description: Merchant ID provided by BillDesk where split refund amount will be adjusted
          pattern: ^[A-Za-z0-9]{1,10}$
          example: BDMERCID
        txn_amount:
          type: string
          description: Split Amount which was settled in the respective Split Merchant ID.
          pattern: ^([1-9]{1}[0-9]{0,7}(\.[0-9]{1,2})?)$
          example: '299.28'
        refund_amount:
          type: string
          description: Refund Amount against txn_amount.
          pattern: ^([1-9]{1}[0-9]{0,7}(\.[0-9]{1,2})?)$
          example: '299.28'
      title: ''
    Currency:
      title: currency
      x-stoplight:
        id: 1ehjh4f7vidz7
      type: string
      description: ISO currency code of the transaction amount, for INR this value will be 356
    Split_payment_refund_response:
      type: object
      x-examples:
        Example 1:
          split_refund:
          - mercid: BDMERCID1
            txn_amount: '75.00'
            refund_amount: '65.00'
            refund_status: 0799
          - mercid: BDMERCID2
            txn_amount: '25.00'
            refund_amount: '25.00'
            refund_status: 0699
      properties:
        mercid:
          type: string
          description: Merchant ID provided by BillDesk where split refund amount will be adjusted
        txn_amount:
          type: string
          description: Split Amount which was settled in the respective Split Merchant ID.
        refund_amount:
          type: string
          description: Refund Amount against txn_amount.
        refund_status:
          type: string
          description: "Represents the refund status of the transaction with the following possible values:\n•\t0799 - transaction is refunded\n•\t0699 - transaction is cancelled"
      description: ''
    Objectid:
      title: objectid
      x-stoplight:
        id: bbwm8bhhbqd4r
      type: string
      description: 'String representing the object''s type. Objects of the same type share the same value. '
