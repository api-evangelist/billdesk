      - authentication
      - mandate
      - invoice
      - cardaccount
      - validatevpa
      - dispute
      - settlement
      - altid
      - mandate_token
      - accountvalidation
      - refund
    Transaction_date:
      title: transaction_date
      x-stoplight:
        id: d0ekw0quxfwwu
      type: string
      description: BillDesk transaction date and time in YYYY-MM-DDThh:mm:ssTZD format
      format: date-time
      example: '2023-03-14T15:14:39+05:30'
