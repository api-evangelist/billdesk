openapi: 3.2.0
info:
  title: Payments Refund API
  description: 'This explorer allows merchants to evaluate APIs that are available in the BillDesk Payment Gateway API suite.

    - Only HMAC authentication is supported.

    - All APIs are RESTful and resource oriented.

    - Servers listed are applicable for the API explorer only.'
  contact:
    name: API Support
    url: https://www.billdesk.com/helpcenter.htm
    email: support@billdesk.com
  version: '2.5'
servers:
- url: https://uat1.billdesk.com/u2
  description: UAT server
- url: https://api.billdesk.com
  description: PROD server
tags:
- name: Refund
paths:
  /payments/ve1_2/refunds/create:
    post:
      summary: Create Refund
      operationId: createRefund
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    objectid: refund
                    refundid: X45604776418751
                    transactionid: X4560477641875
                    orderid: ORDER202200000001
                    mercid: BDMERCID
                    transaction_date: '2022-03-18T11:20:07+05:30'
                    txn_amount: '2.00'
                    refund_amount: '2.00'
                    currency: '356'
                    refund_date: '2022-03-20T21:27:47+05:30'
                    merc_refund_ref_no: REFTS14RTEST001
                    refund_status: 0799
                properties:
                  objectid:
                    $ref: '#/components/schemas/Objectid'
                  refundid:
                    type: string
                    description: Unique refundid created by BillDesk for each refund request
                    pattern: ^[A-Za-z0-9]{1,15}$
                    example: X45604776418751
                  transactionid:
                    $ref: '#/components/schemas/Transactionid'
                  orderid:
                    $ref: '#/components/schemas/Orderid'
                  mercid:
                    $ref: '#/components/schemas/Mercid'
                  transaction_date:
                    $ref: '#/components/schemas/Transaction_date'
                  txn_amount:
                    type: string
                    description: Original transaction amount in two decimals
                    pattern: ^([1-9]{1}[0-9]{0,7}(\.[0-9]{1,2})?)$
                    example: '2400.00'
                  refund_amount:
                    type: string
                    pattern: ^([1-9]{1}[0-9]{0,7}(\.[0-9]{1,2})?)$
                    example: '1100.00'
                    description: Refund amount in two decimals
                  currency:
                    $ref: '#/components/schemas/Currency'
                  refund_date:
                    type: string
                    description: BillDesk refund date and time in YYYY-MM-DDThh:mm:ssTZD format
                    format: date-time
                  merc_refund_ref_no:
                    type: string
                    pattern: ^[A-Za-z0-9\_\:\-]{1,100}$
                    description: Unique reference number created by the merchant for the refund request
                    example: REFTS14RTEST001
                  split_payment:
                    $ref: '#/components/schemas/Split_payment_refund_response'
                  refund_status:
                    type: string
                    description: "Represents the refund status with the following values:\n•\t0799 – categorized as a refund, where the original transaction has been already settled \n•\t0699 – categorized as a cancellation, where the original transaction has not been settled"
                    enum:
                    - 0699
                    - 0799
              examples:
                Create Refund Response:
                  value:
                    objectid: refund
                    refundid: X45604776418751
                    transactionid: X4560477641875
                    orderid: ORDER202200000001
                    mercid: BDMERCID
                    transaction_date: '2022-03-18T11:20:07+05:30'
                    txn_amount: '2.00'
                    refund_amount: '2.00'
                    currency: '356'
                    refund_date: '2022-03-20T21:27:47+05:30'
                    merc_refund_ref_no: REFTS14RTEST001
                    refund_status: 0799
                Create Split Refund Response:
                  value:
                    objectid: refund
                    refundid: X45604776418751
                    transactionid: X4560477641875
                    orderid: ORDER202200000001
                    mercid: BDMERCID
                    transaction_date: '2022-03-18T11:20:07+05:30'
                    txn_amount: '100.00'
                    refund_amount: '90.00'
                    split_refund:
                    - mercid: BDMERCID1
                      txn_amount: '75.00'
                      refund_amount: '65.00'
                      refund_status: 0799
                    - mercid: BDMERCID2
                      txn_amount: '25.00'
                      refund_amount: '25.00'
                      refund_status: 0699
                    currency: '356'
                    refund_date: 2022-03- 20T21:27:47+05:30
                    merc_refund_ref_no: 'REFTS14RTEST001 '
                    refund_status: 0799
          headers:
            BD-Traceid:
              schema:
                type: string
              description: BD-TraceID is a unique identifier passed by the merchant to ensure request idempotency. Requests with identical BD-TraceID within a 24 hour window would fail.
            Content-Type:
              schema:
                type: string
              description: Request Content-Type to take the values application/jose
            Accept:
              schema:
                type: string
              description: Accept Response Content-Type to take the values application/jose
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-object'
              examples:
                Forbidden:
                  $ref: '#/components/examples/403-error'
          headers:
            BD-Traceid:
              schema:
                type: string
              description: BD-TraceID is a unique identifier passed by the merchant to ensure request idempotency. Requests with identical BD-TraceID within a 24 hour window would fail.
            Content-Type:
              schema:
                type: string
              description: Request Content-Type to take the values application/jose
            Accept:
              schema:
                type: string
              description: Accept Response Content-Type to take the values application/jose
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-object'
              examples:
                Internal Server Error:
                  $ref: '#/components/examples/500-error'
          headers:
            BD-Traceid:
              schema:
                type: string
              description: BD-TraceID is a unique identifier passed by the merchant to ensure request idempotency. Requests with identical BD-TraceID within a 24 hour window would fail.
            Content-Type:
              schema:
                type: string
              description: Request Content-Type to take the values application/jose
            Accept:
              schema:
                type: string
              description: Accept Response Content-Type to take the values application/jose
        default:
          description: Any bad or invalid request will lead to following error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-object'
              examples:
                Invalid merchant config:
                  $ref: '#/components/examples/422-Invalid-merchant-config'
          headers:
            BD-Traceid:
              schema:
                type: string
              description: BD-TraceID is a unique identifier passed by the merchant to ensure request idempotency. Requests with identical BD-TraceID within a 24 hour window would fail.
            Content-Type:
              schema:
                type: string
              description: Request Content-Type to take the values application/jose
            Accept:
              schema:
                type: string
              description: Accept Response Content-Type to take the values application/jose
      parameters:
      - $ref: '#/components/parameters/bdTraceId'
      - $ref: '#/components/parameters/bdTimeStamp'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  transactionid: X4560477641875
                  orderid: ORDER202200000001
                  mercid: BDMERCID
                  transaction_date: '2022-03-18T11:20:07+05:30'
                  txn_amount: '2.00'
                  refund_amount: '2.00'
                  currency: '356'
                  merc_refund_ref_no: REFTS14RTEST001
              properties:
                transactionid:
                  $ref: '#/components/schemas/Transactionid'
                orderid:
                  $ref: '#/components/schemas/Orderid'
                mercid:
                  $ref: '#/components/schemas/Mercid'
                transaction_date:
                  $ref: '#/components/schemas/Transaction_date'
                txn_amount:
                  type: string
                  description: Original transaction amount in two decimals
                  pattern: ^([1-9]{1}[0-9]{0,7}(\.[0-9]{1,2})?)$
                  example: '2400.00'
                refund_amount:
                  type: string
                  pattern: ^([1-9]{1}[0-9]{0,7}(\.[0-9]{1,2})?)$
                  description: Refund amount in two decimals
                  example: '1100.00'
                currency:
                  $ref: '#/components/schemas/Currency'
                merc_refund_ref_no:
                  type: string
                  description: Unique reference number created by the merchant for the refund request
                  pattern: ^[A-Za-z0-9\_\:\-]{1,100}$
                  example: REFTS14RTEST001
                split_payment:
                  $ref: '#/components/schemas/Split_payment_refund_request'
              required:
              - transactionid
              - orderid
              - mercid
              - transaction_date
              - txn_amount
              - refund_amount
              - currency
              - merc_refund_ref_no
            examples:
              Create Refund:
                value:
                  transactionid: X4560477641875
                  orderid: ORDER202200000001
                  mercid: BDMERCID
                  transaction_date: '2022-03-18T11:20:07+05:30'
                  txn_amount: '2.00'
                  refund_amount: '2.00'
                  currency: '356'
                  merc_refund_ref_no: REFTS14RTEST001
              Create Split Refund:
                value:
                  transactionid: X4560477641875
                  orderid: ORDER202200000001
                  mercid: BDMERCID
                  transaction_date: '2022-03-18T11:20:07+05:30'
                  txn_amount: '100.00'
                  refund_amount: '90.00'
                  split_refund:
                  - mercid: BDMERCID1
                    txn_amount: '75.00'
                    refund_amount: '65.00'
                  - mercid: BDMERCID2
                    txn_amount: '25.00'
                    refund_amount: '25.00'
                  currency: '356'
                  merc_refund_ref_no: REFTS14RTEST001
      description: 'A refund can be initiated for a transaction using the Create Refund API.


        Multiple refund requests can be initiated against the same transactionid such that the sum of the refund amounts do not exceed the transaction amount.'
      tags:
      - Refund
