- aid: billdesk:neo-payments-api
  name: BillDesk Neo Full Redirect API
  description: >-
    Pre-built hosted checkout solution for one-time and recurring online payments. Merchants redirect
    customers to BillDesk-hosted pages, minimizing PCI DSS scope.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.billdesk.io/docs/guide-to-the-billdesk-documentation-portal
